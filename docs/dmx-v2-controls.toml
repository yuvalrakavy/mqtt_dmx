# Sensitivity controls for explicit fallback durability. Run through Store's
# scripts/negative-control.py with --root pointing at this checkout and a host
# CARGO_BUILD_TARGET; the legacy default target is Raspberry Pi.

[[control]]
name = "fallback_file_sync_is_required"
guard = "fallback_file_sync"
file = "mqtt_dmx/src/recovery_file.rs"
anchor = 'self.io.sync_file(&temporary)'
replacement = 'Ok::<(), io::Error>(())'
crate = "mqtt_dmx"
target = "lib"
test = "recovery_file::tests::failure_before_replace_preserves_previous_fallback"
expect_text = 'called `Result::unwrap_err()` on an `Ok` value'

[[control]]
name = "fallback_directory_sync_is_required_after_replace"
guard = "fallback_post_replace_directory_sync"
file = "mqtt_dmx/src/recovery_file.rs"
anchor = '''self.io.sync_parent(&parent).map_err(|source| Error::Io {
                stage: "directory_sync",
                source,
                uncertain: true,
            })?;
            check_save(allowed, true)'''
replacement = 'check_save(allowed, true)'
crate = "mqtt_dmx"
target = "lib"
test = "recovery_file::tests::failed_directory_sync_is_uncertain_and_retry_resyncs"
expect_text = 'failing.save(id(2)'

[[control]]
name = "equal_save_id_does_not_skip_durability"
guard = "fallback_repeat_save_durability"
file = "mqtt_dmx/src/recovery_file.rs"
anchor = '''// The previous rename may have succeeded without a confirmed
                // directory sync. Equality alone is not a durability receipt.
                self.io.sync_file(&self.path).map_err(|source| Error::Io {
                    stage: "file_sync",
                    source,
                    uncertain: true,
                })?;
                self.io.sync_parent(&parent).map_err(|source| Error::Io {
                    stage: "directory_sync",
                    source,
                    uncertain: true,
                })?;
                return check_save(allowed, true);'''
replacement = 'return check_save(allowed, true);'
crate = "mqtt_dmx"
target = "lib"
test = "recovery_file::tests::failed_directory_sync_is_uncertain_and_retry_resyncs"
expect_text = "equal save id cannot bypass failed durability"

