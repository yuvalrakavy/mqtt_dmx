target = "lib"
test = "memory::tests::reservations_cover_simultaneous_slots_recovery_and_future_fade_maps"
expect_text = "a future fade's initial map was not reserved"

[[control]]
name = "concurrent_fallback_slots_omitted"
guard = "simultaneous preparation and fallback"
