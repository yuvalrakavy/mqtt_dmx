replacement = 'pub const ENGINE_SLOTS: usize = 6;'
crate = "mqtt_dmx"
target = "lib"
test = "memory::tests::reservations_cover_simultaneous_slots_recovery_and_future_fade_maps"
expect_text = "concurrent fallback slots were not reserved"

[[control]]
name = "recovery_copies_not_reserved"
