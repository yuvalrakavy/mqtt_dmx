# Negative controls for mqtt_dmx's no-hang 3b change (Store no-hang §14). Run from Store with
#     scripts/negative-control.py --root ../Home/mqtt_dmx-3b/mqtt_dmx ../Home/mqtt_dmx-3b/mqtt_dmx/docs/no-hang-3b-controls.toml
# (The saturation tests' failing-first runs on the old session: the burst reported 1 of 100 error
# reports after the broker recovered; the ArtNet manager stopped answering with its error queue
# full. The ArtNet path's session test once used a failing command as its sentinel, which waits on
# the error queue itself, so it went green with the ArtNet fix alone reverted (the pump fix alone
# breaks that cycle). It now measures the bridge with commands that report no error, during the
# stall and after it, and the_artnet_ticker_waits_on_the_error_queue_in_a_session reverts the
# ArtNet fix alone.)

[[control]]
name        = "the_pump_waits_on_the_subscriber"
file        = "src/mqtt_pump.rs"
anchor      = '''                    Ok(Event::Incoming(Packet::Publish(publish))) => {
                        pushed.pushed();'''
replacement = '''                    Ok(Event::Incoming(Packet::Publish(publish))) => {
                        // control: a forward queue of one — the pump waits for the subscriber
                        while pushed.depth.load(Ordering::SeqCst) > 0 {
                            tokio::time::sleep(std::time::Duration::from_millis(1)).await;
                        }
                        pushed.pushed();'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_burst_of_failing_commands_against_a_stalled_broker"]
expect_text = "error reports arrived after the broker recovered"
guard       = "pump_waits_on_nothing"

[[control]]
name        = "the_artnet_ticker_waits_on_the_error_queue"
file        = "src/artnet_manager/manager.rs"
anchor      = '''                        if !reporter.report(format!("Effect {effect_id}: {e}")) {'''
replacement = '''                        if reporter.to_mqtt_publisher.send(ToMqttPublisherMessage::Error(format!("Effect {effect_id}: {e}"))).await.is_err() {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "the_ticker_keeps_answering_while_the_mqtt_error_queue_is_full"]
expect_text = "the ArtNet manager stopped answering while the MQTT error queue was full"
guard       = "artnet_never_waits_on_mqtt"

[[control]]
name        = "the_artnet_ticker_waits_on_the_error_queue_in_a_session"
file        = "src/artnet_manager/manager.rs"
anchor      = '''                        if !reporter.report(format!("Effect {effect_id}: {e}")) {'''
replacement = '''                        if reporter.to_mqtt_publisher.send(ToMqttPublisherMessage::Error(format!("Effect {effect_id}: {e}"))).await.is_err() {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "commands_that_wait_on_artnet_complete_while_its_errors_back_up"]
expect_text = "the bridge stopped taking commands while the broker was stalled"
guard       = "bridge_answers_while_the_broker_stalls"

[[control]]
name        = "a_failing_effect_drops_every_running_effect"
file        = "src/artnet_manager/manager.rs"
anchor      = '''        self.active_effects = active_effects; // Move it back
        failed'''
replacement = '''        // control: the old tick, which never put the effects back after a failure
        if failed.is_empty() {
            self.active_effects = active_effects;
        }
        failed'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_failing_effect_does_not_stop_the_others"]
expect_text = "a failing effect stopped the healthy one"
guard       = "effects_fail_alone"

[[control]]
name        = "every_dropped_report_is_a_warn"
file        = "src/artnet_manager/manager.rs"
anchor      = '''                    Some((_, dropped)) => *dropped += 1,'''
replacement = '''                    Some((_, dropped)) => {
                        *dropped += 1;
                        warn!(kind = "error_report_dropped", "control: a WARN per dropped report");
                    }'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_full_error_queue_is_one_warn_per_episode"]
expect_text = "not one WARN per episode of dropped reports"
guard       = "dropped_reports_one_warn"

[[control]]
name        = "a_drop_episode_never_ends"
file        = "src/artnet_manager/manager.rs"
anchor      = '''            if self.to_mqtt_publisher.len() <= half {'''
replacement = '''            if self.to_mqtt_publisher.len() <= half && half == usize::MAX {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_full_error_queue_is_one_warn_per_episode"]
expect_text = "no INFO with each episode's total once the queue drained"
guard       = "dropped_reports_drain_info"

[[control]]
name        = "the_backlog_never_raises_its_warn"
file        = "src/mqtt_pump.rs"
anchor      = '''            if high.is_none() {
                *high = Some(Instant::now());'''
replacement = '''            if false {
                *high = Some(Instant::now());'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_backlog_past_high_water"]
expect_text = "not flagged at the high-water mark"
guard       = "backlog_high_water"

[[control]]
name        = "a_wait_loses_its_tag"
file        = "src/mqtt_publisher.rs"
anchor      = '''                    // WAIT: mqtt-request
                    mqtt_client.publish_with_properties("DMX/LastError",'''
replacement = '''                    mqtt_client.publish_with_properties("DMX/LastError",'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "wait_registry"]
expect_text = "is an untagged wait"
guard       = "registry_wired"

[[control]]
name        = "a_tag_trails_its_code"
file        = "src/mqtt_pump.rs"
anchor      = '''                // WAIT: mqtt-poll
                match events.poll().await {'''
replacement = '''                match events.poll().await { // WAIT: mqtt-poll'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "wait_registry", "--", "every_tag_is_on_its_own_line"]
expect_text = "tag trails code on its line"
guard       = "tags_survive_rustfmt"

[[control]]
name        = "a_collision_is_undeclared"
file        = "docs/wait-registry.md"
anchor      = '''local-methods = handle_message'''
replacement = '''# local-methods = handle_message'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "wait_registry"]
expect_text = "`.handle_message(..).await` on a receiver other than `self`"
guard       = "collision_declared"
